<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaLinha</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
        color: #0f172a;
      }

      .card {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        padding: 20px 24px;
        box-shadow: 0 8px 24px rgba(2, 6, 23, 0.1);
        width: 80vw;
        max-height: 90vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ── top bar ── */
      .top-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .top-bar h1 {
        margin: 0;
        font-size: 24px;
        flex: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .top-bar h1 img {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        flex-shrink: 0;
      }

      .top-bar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      #loadDataBtn {
        padding: 8px 16px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #loadDataBtn:hover {
        background: #1d4ed8;
      }

      #loadDataBtn:disabled {
        background: #94a3b8;
        color: #e2e8f0;
        cursor: not-allowed;
        opacity: 0.8;
      }

      #autoUpdateBtn {
        padding: 8px 16px;
        border: none;
        border-radius: 10px;
        background: #16a34a;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #autoUpdateBtn:hover {
        filter: brightness(0.9);
      }

      #autoUpdateBtn.stopped {
        background: #9ca3af;
      }

      #loadHistoricalBtn {
        padding: 8px 16px;
        border: none;
        border-radius: 10px;
        background: #0f766e;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #loadHistoricalBtn:hover {
        background: #115e59;
      }

      /* ── data-time ── */
      .data-time-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      #dataTimeText {
        font-family: "Courier New", Courier, monospace;
      }

      #status {
        font-size: 13px;
        color: #475569;
        margin: 0;
      }

      /* ── controls bar ── */
      .controls-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 180px;
        display: flex;
      }

      .search-box input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        background: #f8fafc;
        outline: none;
      }

      .search-box input:focus {
        border-color: #2563eb;
        background: #fff;
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        flex-wrap: wrap;
      }

      .pagination-controls label {
        white-space: nowrap;
      }

      .pagination-controls select {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 12px;
        background: #ffffff;
      }

      .pagination-controls button {
        padding: 5px 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        font-size: 12px;
        margin: 0;
      }

      .pagination-controls button:hover {
        background: #1d4ed8;
      }

      #pageInfo {
        min-width: 90px;
        text-align: center;
      }

      /* ── table ── */
      .table-wrap {
        flex: 1;
        overflow: auto;
        min-height: 0;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 7px 8px;
        text-align: left;
        vertical-align: top;
        word-break: break-word;
      }

      th {
        position: sticky;
        top: 0;
        background: #e2e8f0;
        font-weight: 700;
      }

      .empty-result {
        padding: 10px;
        font-size: 12px;
      }

      /* ── footer ── */
      #totalCount {
        font-size: 12px;
        color: #64748b;
        margin: 0;
        text-align: right;
      }

      /* ── dots ── */
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9ca3af;
        flex-shrink: 0;
      }

      .dot--green-blink { background: #22c55e; animation: blink 1s infinite; }
      .dot--green       { background: #16a34a; }
      .dot--yellow      { background: #f59e0b; }
      .dot--red         { background: #dc2626; }
      .dot--neutral     { background: #9ca3af; }

      @keyframes blink {
        0%   { opacity: 1; }
        50%  { opacity: 0.3; }
        100% { opacity: 1; }
      }

      .status-cell {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: #9ca3af;
      }

      .status-dot--green  { background: #16a34a; }
      .status-dot--yellow { background: #f59e0b; }
      .status-dot--red    { background: #dc2626; }
      .status-dot--gray   { background: #9ca3af; }

      .adapt-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #1d4ed8;
        color: #fff;
        border-radius: 4px;
        width: 22px;
        height: 22px;
        font-size: 15px;
        line-height: 1;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 1000;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-card {
        width: min(92vw, 420px);
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.25);
        padding: 16px;
        display: grid;
        gap: 10px;
      }

      .modal-card h2 {
        margin: 0;
        font-size: 16px;
      }

      .modal-card p {
        margin: 0;
        font-size: 12px;
        color: #475569;
      }

      #historicalDateInput {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        background: #f8fafc;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .modal-actions button {
        padding: 7px 12px;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      #cancelHistoricalBtn {
        background: #64748b;
      }

      #confirmHistoricalBtn {
        background: #2563eb;
      }

      #preloadTooltip {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1100;
        max-width: 320px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        font-size: 12px;
        line-height: 1.3;
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.25);
        pointer-events: none;
      }

      #preloadTooltip.success {
        background: rgba(21, 128, 61, 0.9);
      }

      #preloadTooltip.error {
        background: rgba(153, 27, 27, 0.92);
      }
    </style>
  </head>
  <body>
    <section class="card">
      <!-- top bar -->
      <div class="top-bar">
        <h1><img src="icons/icon32.png" alt="" aria-hidden="true" />Relátorio de Operações</h1>
        <div class="top-bar-right">
          <p id="status" aria-live="polite">Pronto para buscar.</p>
          <button id="autoUpdateBtn" type="button">Auto: ON</button>
          <button id="loadHistoricalBtn" type="button">Período anterior</button>
          <button id="loadDataBtn" type="button">Atualizar</button>
        </div>
      </div>

      <!-- data/time -->
      <div id="dataTimeOutput" class="data-time-box">
        <span id="dataTimeText">Sem dados</span>
        <span id="freshnessDot" class="dot dot--neutral" aria-hidden="true"></span>
      </div>

      <!-- search + pagination -->
      <div class="controls-bar">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="linha:386  ou  prefixo:XY014" aria-label="Buscar" />
        </div>
        <div class="pagination-controls">
          <label for="pageSizeSelect">Itens por página</label>
          <select id="pageSizeSelect">
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
          <button id="prevPageBtn" type="button">Anterior</button>
          <span id="pageInfo">Página 0/0</span>
          <button id="nextPageBtn" type="button">Próxima</button>
        </div>
      </div>

      <!-- table -->
      <div id="resultOutput" class="table-wrap"></div>

      <!-- footer -->
      <p id="totalCount"></p>
    </section>

    <div id="historicalModal" class="modal-overlay" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="historicalModalTitle">
        <h2 id="historicalModalTitle">Carregar Período Anterior</h2>
        <p>Selecione uma data e hora anterior ao momento atual.</p>
        <input id="historicalDateInput" type="datetime-local" />
        <div class="modal-actions">
          <button id="cancelHistoricalBtn" type="button">Cancelar</button>
          <button id="confirmHistoricalBtn" type="button">Carregar</button>
        </div>
      </div>
    </div>

    <script type="module" src="nalinha.js"></script>
    <div id="preloadTooltip">Pre-cache: aguardando primeiro ciclo...</div>
  </body>
</html>
